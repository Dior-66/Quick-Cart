<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quick Cart — Product</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      min-height: 72px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f97316;
      font-size: 25px;
      font-weight: 800;
    }

    .cart-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f97316;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .back-top {
      color: #333;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #eee;
      box-shadow: 0 5px 25px rgba(0,0,0,0.05);
    }

    .gallery {
      background: #f3f4f6;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: 420px;
      object-fit: contain;
      display: none;
      background: #f3f4f6;
    }

    .placeholder {
      font-size: 80px;
    }

    .content {
      padding: 35px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
      line-height: 1.15;
    }

    .price {
      color: #f97316;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .location,
    .condition {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .condition strong {
      color: #333;
    }

    .description-title {
      margin-top: 30px;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .description {
      color: #444;
      font-size: 17px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .primary {
      background: #f97316;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .status {
      max-width: 700px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
    }

    .status h2 {
      margin-bottom: 12px;
    }

    .status p {
      color: #666;
      margin-bottom: 20px;
    }

    .gallery-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .thumb {
      width: 60px;
      height: 45px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid white;
      cursor: pointer;
      background: white;
    }

    .thumb.active {
      border-color: #f97316;
    }

    footer {
      margin-top: 50px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }


    .checkout-panel, .orders-panel { margin-top: 28px; padding: 24px; border: 1px solid #eee; border-radius: 14px; background: #fff; }
    .checkout-panel h2, .orders-panel h2 { margin-bottom: 16px; }
    .checkout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .checkout-grid .full { grid-column: 1 / -1; }
    .checkout-grid label { display: block; font-weight: 700; font-size: 14px; }
    .checkout-grid input, .checkout-grid textarea { width: 100%; margin-top: 7px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font: inherit; }
    .checkout-grid textarea { min-height: 90px; resize: vertical; }
    .notice { margin: 12px 0; padding: 12px; border-radius: 8px; background: #fff7ed; color: #9a3412; line-height: 1.5; }
    .order-item { border: 1px solid #eee; border-radius: 10px; padding: 14px; margin-top: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    .order-item strong { color: #222; }
    .button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 600px) { .checkout-grid { grid-template-columns: 1fr; } .checkout-grid .full { grid-column: auto; } .checkout-panel, .orders-panel { padding: 18px; } }

    @media (max-width: 700px) {
      .container {
        margin: 20px auto;
        padding: 0 12px;
      }

      .gallery {
        min-height: 300px;
      }

      .main-image {
        height: 300px;
      }

      .content {
        padding: 25px 20px;
      }

      h1 {
        font-size: 30px;
      }

      .price {
        font-size: 27px;
      }

      .navbar {
        padding: 12px 15px;
      }

      .back-top {
        font-size: 14px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header>
    <nav class="navbar">

      <a href="index.html" class="logo">
        <div class="cart-icon">🛒</div>
        Quick Cart
      </a>

      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label for="displayCurrency" style="font-size:13px;font-weight:700">Display currency
          <select id="displayCurrency" aria-label="Display prices in currency" style="padding:8px;border:1px solid #ddd;border-radius:8px">
            <option>AED</option><option>USD</option><option>GBP</option><option>EUR</option><option>INR</option><option>PKR</option><option>SAR</option><option>CAD</option><option>AUD</option><option>CNY</option><option>JPY</option><option>SGD</option><option>NZD</option><option>TRY</option><option>ZAR</option><option>NGN</option><option>EGP</option><option>BRL</option><option>MXN</option><option>CHF</option><option>BDT</option><option>PHP</option><option>THB</option><option>MYR</option><option>IDR</option><option>VND</option><option>KES</option><option>GHS</option><option>QAR</option><option>KWD</option><option>BHD</option><option>OMR</option>
          </select>
        </label>
        <a href="index.html" class="back-top">← Back to Listings</a>
      </div>

    </nav>
  </header>

  <main class="container">

    <div id="content">

      <div class="status">
        <h2>Loading listing...</h2>
        <p>Please wait.</p>
      </div>

    </div>

  </main>

  <footer>
    © 2026 Quick Cart — Buy Smart. Sell Easy. · <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener" style="color:white">Rates by Exchange Rate API</a>
  </footer>

  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://dgnkmkyueqgbiahztuux.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_4j_ZqL-Mw_nH9oguTAi68g_mM-FHFT_";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* =========================
       GET LISTING ID
    ========================= */

    const params =
      new URLSearchParams(window.location.search);

    const listingId =
      params.get("id");


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       IMAGE URL
    ========================= */

    function getImageUrl(image) {

      if (!image) {
        return null;
      }

      return (
        image.image_url ||
        image.url ||
        image.public_url ||
        image.storage_url ||
        image.path ||
        null
      );

    }


    const CURRENCY_KEY = "quickCartDisplayCurrency";
    let exchangeRates = null;

    function getDisplayCurrency() {
      return localStorage.getItem(CURRENCY_KEY) || "AED";
    }

    async function getExchangeRates() {
      if (exchangeRates) return exchangeRates;
      const cached = localStorage.getItem("quickCartUsdRates");
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed.savedAt && Date.now() - parsed.savedAt < 24 * 60 * 60 * 1000 && parsed.rates) {
            exchangeRates = parsed.rates;
            return exchangeRates;
          }
        } catch (_) {}
      }
      const response = await fetch("https://open.er-api.com/v6/latest/USD");
      if (!response.ok) throw new Error("Exchange rates unavailable");
      const data = await response.json();
      if (data.result !== "success" || !data.rates) throw new Error("Exchange rates unavailable");
      exchangeRates = data.rates;
      localStorage.setItem("quickCartUsdRates", JSON.stringify({savedAt: Date.now(), rates: data.rates}));
      return exchangeRates;
    }

    function formatCurrency(amount, currency) {
      return new Intl.NumberFormat("en", {style:"currency", currency:currency, maximumFractionDigits:2}).format(amount);
    }

    async function updateListingPrice() {
      const priceElement = document.getElementById("listingPrice");
      const picker = document.getElementById("displayCurrency");
      if (!priceElement || !picker) return;
      const originalAmount = Number(priceElement.dataset.amount);
      const originalCurrency = priceElement.dataset.currency || "USD";
      const displayCurrency = getDisplayCurrency();
      picker.value = displayCurrency;
      if (!Number.isFinite(originalAmount)) return;
      if (originalCurrency === displayCurrency) {
        priceElement.textContent = formatCurrency(originalAmount, originalCurrency);
        return;
      }
      priceElement.textContent = "Converting price…";
      try {
        const rates = await getExchangeRates();
        if (!rates[originalCurrency] || !rates[displayCurrency]) throw new Error("Currency unsupported");
        const converted = originalAmount / rates[originalCurrency] * rates[displayCurrency];
        priceElement.textContent = "≈ " + formatCurrency(converted, displayCurrency) + "*";
      } catch (_) {
        priceElement.textContent = formatCurrency(originalAmount, originalCurrency) + " (conversion unavailable)";
      }
    }

    document.getElementById("displayCurrency").addEventListener("change", function(event) {
      localStorage.setItem(CURRENCY_KEY, event.target.value);
      updateListingPrice();
    });

    /* =========================
       LOAD LISTING
    ========================= */

    async function loadListing() {

      const content =
        document.getElementById("content");


      if (!listingId) {

        content.innerHTML = `
          <div class="status">
            <h2>Listing not found</h2>
            <p>No listing ID was provided.</p>
            <a class="button primary" href="index.html">
              Back to Listings
            </a>
          </div>
        `;

        return;
      }


      try {

        /* GET LISTING */

        const listingResult =
          await supabaseClient
            .from("listings")
            .select("*")
            .eq("id", listingId)
            .eq("status", "Active")
            .single();


        const listing =
          listingResult.data;

        const listingError =
          listingResult.error;

        currentListing = listing;


        if (listingError || !listing) {

          console.error(
            "Listing error:",
            listingError
          );

          content.innerHTML = `
            <div class="status">
              <h2>Listing not found</h2>
              <p>This listing may no longer be available.</p>
              <a class="button primary" href="index.html">
                Back to Listings
              </a>
            </div>
          `;

          return;
        }


        /* GET IMAGES */

        let images = [];

        const imageResult =
          await supabaseClient
            .from("listing_images")
            .select("*")
            .eq("listing_id", listingId)
            .order("display_order", {
              ascending: true
            });


        if (!imageResult.error && imageResult.data) {
          images = imageResult.data;
        }


        console.log(
          "Quick Cart listing:",
          listing
        );

        console.log(
          "Quick Cart listing images:",
          images
        );


        /* IMAGE URLS */

        const imageUrls =
          images
            .map(getImageUrl)
            .filter(Boolean);


        content.innerHTML = `

          <div class="card">

            <div class="gallery">

              ${
                imageUrls.length > 0

                ? `
                  <img
                    id="mainImage"
                    class="main-image"
                    src="${escapeHtml(imageUrls[0])}"
                    alt="${escapeHtml(listing.title)}"
                    style="display:block;"
                  >

                  <div class="gallery-controls">

                    ${imageUrls.map((url, index) => `
                      <img
                        class="thumb ${index === 0 ? "active" : ""}"
                        src="${escapeHtml(url)}"
                        alt="Product image ${index + 1}"
                        onclick="changeImage(${index})"
                      >
                    `).join("")}

                  </div>
                `

                : `
                  <div class="placeholder">
                    🛒
                  </div>
                `
              }

            </div>


            <div class="content">

              <h1>
                ${escapeHtml(
                  listing.title || "Untitled Listing"
                )}
              </h1>


              <div class="price" id="listingPrice" data-amount="${escapeHtml(String(listing.price ?? ""))}" data-currency="${escapeHtml(listing.currency || "USD")}">
                ${escapeHtml(listing.currency || "USD")} ${escapeHtml(String(listing.price ?? ""))}
              </div>
              <p style="font-size:12px;color:#777;margin-top:-8px">Converted prices are estimates; the seller's original currency is used for the actual listing.</p>


              <div class="location">
                📍
                ${escapeHtml(
                  listing.location ||
                  "Location not specified"
                )}
              </div>


              ${
                listing.condition
                ? `
                  <div class="condition">
                    <strong>Condition:</strong>
                    ${escapeHtml(listing.condition)}
                  </div>
                `
                : ""
              }


              <h2 class="description-title">
                Description
              </h2>


              <div class="description">
                ${escapeHtml(
                  listing.description ||
                  "No description provided."
                )}
              </div>


              <div class="buttons">

                <button type="button" class="button primary" id="buyNowButton" onclick="showCheckout()">
                  Buy Now · Cash on Delivery
                </button>

                <button
                  class="button secondary"
                  onclick="messageSeller()"
                >
                  Message Seller
                </button>


                <a
                  class="button secondary"
                  href="index.html"
                >
                  ← Back
                </a>

              </div>

            </div>

          </div>

          <section id="checkoutPanel" class="checkout-panel" hidden>
            <h2>Cash on Delivery Checkout</h2>
            <p style="color:#666;line-height:1.6;margin-bottom:16px">Confirm your contact details and delivery address. You will pay the seller when the item is delivered.</p>
            <div class="notice">Payment is not collected online. This creates an order request in Quick Cart.</div>
            <form id="checkoutForm">
              <div class="checkout-grid">
                <label>Full name<input id="buyerName" name="buyerName" autocomplete="name" required maxlength="120"></label>
                <label>Phone number<input id="buyerPhone" name="buyerPhone" autocomplete="tel" required maxlength="40" placeholder="Include country code"></label>
                <label class="full">Delivery address<textarea id="shippingAddress" name="shippingAddress" autocomplete="street-address" required maxlength="1000" placeholder="Building, street, area, city, and any delivery details"></textarea></label>
              </div>
              <p id="checkoutMessage" role="status" style="margin-top:12px;line-height:1.5"></p>
              <div class="buttons" style="margin-top:18px">
                <button id="placeOrderButton" type="submit" class="button primary">Place Order</button>
                <button type="button" class="button secondary" onclick="hideCheckout()">Cancel</button>
              </div>
            </form>
          </section>

          <section id="ordersPanel" class="orders-panel">
            <h2>My Orders</h2>
            <p id="ordersMessage" style="color:#666;line-height:1.5">Sign in to view orders you have placed.</p>
            <div id="ordersList"></div>
            <button type="button" id="loadOrdersButton" class="button secondary" style="margin-top:14px" onclick="loadMyOrders()">Refresh My Orders</button>
          </section>
        `;


        window.quickCartImages =
          imageUrls;
        const checkoutForm = document.getElementById("checkoutForm");
        if (checkoutForm) checkoutForm.addEventListener("submit", handleCheckoutSubmit);
        updateListingPrice();
        loadMyOrders();


      } catch (error) {

        console.error(
          "Unexpected listing error:",
          error
        );

        content.innerHTML = `
          <div class="status">
            <h2>Something went wrong</h2>
            <p>Please refresh the page and try again.</p>
            <a class="button primary" href="index.html">
              Back to Listings
            </a>
          </div>
        `;
      }
    }


    /* =========================
       CHANGE IMAGE
    ========================= */

    function changeImage(index) {

      const images =
        window.quickCartImages || [];

      if (!images[index]) {
        return;
      }

      const mainImage =
        document.getElementById("mainImage");

      if (mainImage) {

        mainImage.src =
          images[index];

        mainImage.style.display =
          "block";
      }


      document
        .querySelectorAll(".thumb")
        .forEach(function(thumb, i) {

          thumb.classList.toggle(
            "active",
            i === index
          );

        });

    }


    /* =========================
       MESSAGE SELLER
    ========================= */

    function messageSeller() {

      alert(
        "Message Seller will be connected to Quick Cart messaging next."
      );

    }



    /* =========================
       CHECKOUT / CASH ON DELIVERY
    ========================= */
    let currentListing = null;
    let checkoutBusy = false;
    // Preview mode is enabled only when the signed-in user opens their own listing.
    // It never writes an order to Supabase and does not bypass the own-listing rule.
    let checkoutPreviewOnly = false;

    async function showCheckout() {
      if (!currentListing) return;
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        alert("Please sign in before placing an order. You will be taken to the login page.");
        window.location.href = "login.html";
        return;
      }
      checkoutPreviewOnly = Boolean(currentListing.seller_id && currentListing.seller_id === user.id);
      const panel = document.getElementById("checkoutPanel");
      if (!panel) return;
      const notice = panel.querySelector(".notice");
      const submitButton = document.getElementById("placeOrderButton");
      if (checkoutPreviewOnly) {
        if (notice) notice.textContent = "TEST PREVIEW ONLY: this is your own listing. You can preview the checkout form, but no order will be saved. Quick Cart still blocks purchases of your own listings.";
        if (submitButton) submitButton.textContent = "Preview Checkout (No Order)";
      } else {
        if (notice) notice.textContent = "Payment is not collected online. This creates an order request in Quick Cart.";
        if (submitButton) submitButton.textContent = "Place Order";
      }
      const checkoutMessage = document.getElementById("checkoutMessage");
      if (checkoutMessage) checkoutMessage.textContent = checkoutPreviewOnly ? "Preview mode: submitting this form will not create an order." : "";
      panel.hidden = false;
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
      const nameInput = document.getElementById("buyerName");
      if (nameInput && !nameInput.value) {
        const { data: profile } = await supabaseClient.from("profiles").select("full_name, phone").eq("id", user.id).maybeSingle();
        if (profile?.full_name) nameInput.value = profile.full_name;
        const phoneInput = document.getElementById("buyerPhone");
        if (phoneInput && profile?.phone) phoneInput.value = profile.phone;
      }
    }

    function hideCheckout() {
      const panel = document.getElementById("checkoutPanel");
      if (panel) panel.hidden = true;
      checkoutPreviewOnly = false;
    }

    function makeOrderNumber() {
      const date = new Date();
      const stamp = date.getFullYear().toString() + String(date.getMonth()+1).padStart(2,"0") + String(date.getDate()).padStart(2,"0");
      const random = Math.random().toString(36).slice(2, 8).toUpperCase();
      return "QC-" + stamp + "-" + random;
    }

    async function handleCheckoutSubmit(event) {
      event.preventDefault();
      if (checkoutBusy || !currentListing) return;
      const message = document.getElementById("checkoutMessage");
      const button = document.getElementById("placeOrderButton");
      const buyerName = document.getElementById("buyerName").value.trim();
      const buyerPhone = document.getElementById("buyerPhone").value.trim();
      const shippingAddress = document.getElementById("shippingAddress").value.trim();
      if (!buyerName || !buyerPhone || !shippingAddress) {
        message.textContent = "Please complete all fields.";
        return;
      }
      if (checkoutPreviewOnly) {
        message.textContent = "Checkout preview successful. No order was created or saved. Your own-listing purchase protection remains enabled.";
        return;
      }
      const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
      if (authError || !user) {
        message.textContent = "Your session has expired. Please sign in again.";
        return;
      }
      if (!currentListing.seller_id) {
        message.textContent = "This listing does not have a seller ID, so an order cannot be created. Please contact support.";
        return;
      }
      if (currentListing.seller_id === user.id) {
        message.textContent = "You cannot order your own listing.";
        return;
      }
      const price = Number(currentListing.price);
      if (!Number.isFinite(price) || price < 0) {
        message.textContent = "This listing has an invalid price. Please contact the seller.";
        return;
      }
      checkoutBusy = true;
      button.disabled = true;
      button.textContent = "Placing order…";
      message.textContent = "Saving your order…";
      const orderData = {
        order_number: makeOrderNumber(),
        listing_id: currentListing.id,
        buyer_id: user.id,
        seller_id: currentListing.seller_id,
        buyer_name: buyerName,
        buyer_phone: buyerPhone,
        item_title: currentListing.title || "Quick Cart item",
        quantity: 1,
        original_price: price,
        agreed_price: price,
        order_status: "Pending Payment",
        payment_status: "Unpaid",
        delivery_method: "Cash on Delivery",
        shipping_address: shippingAddress
      };
      try {
        const { data, error } = await supabaseClient.from("orders").insert(orderData).select("order_number").single();
        if (error) throw error;
        message.textContent = "Order placed successfully! Your order number is " + (data?.order_number || orderData.order_number) + ". Payment is due on delivery.";
        document.getElementById("checkoutForm").reset();
        await loadMyOrders();
      } catch (err) {
        console.error("Quick Cart order error:", err);
        message.textContent = "We could not save the order. " + (err?.message || "Please check your connection and Supabase order policies, then try again.");
      } finally {
        checkoutBusy = false;
        button.disabled = false;
        button.textContent = "Place Order";
      }
    }

    /* =========================
       MY ORDERS
    ========================= */
    async function loadMyOrders() {
      const message = document.getElementById("ordersMessage");
      const list = document.getElementById("ordersList");
      if (!message || !list) return;
      message.textContent = "Loading your orders…";
      list.innerHTML = "";
      const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
      if (authError || !user) {
        message.textContent = "Please sign in to view your orders.";
        return;
      }
      const { data, error } = await supabaseClient
        .from("orders")
        .select("order_number,item_title,quantity,agreed_price,order_status,payment_status,delivery_method,created_at")
        .eq("buyer_id", user.id)
        .order("created_at", { ascending: false });
      if (error) {
        console.error("Quick Cart My Orders error:", error);
        message.textContent = "Could not load orders. Please check the orders table SELECT policy for signed-in buyers.";
        return;
      }
      if (!data || data.length === 0) {
        message.textContent = "You have not placed any orders yet.";
        return;
      }
      message.textContent = "You have " + data.length + " order(s).";
      list.innerHTML = data.map(order => `
        <article class="order-item">
          <div><strong>Order:</strong> ${escapeHtml(order.order_number || "—")}</div>
          <div><strong>Item:</strong> ${escapeHtml(order.item_title || "Quick Cart item")}</div>
          <div><strong>Quantity:</strong> ${escapeHtml(String(order.quantity ?? 1))}</div>
          <div><strong>Agreed price:</strong> ${escapeHtml(String(order.agreed_price ?? "—"))} (seller's listing currency)</div>
          <div><strong>Order status:</strong> ${escapeHtml(order.order_status || "—")}</div>
          <div><strong>Payment:</strong> ${escapeHtml(order.payment_status || "—")} · ${escapeHtml(order.delivery_method || "Cash on Delivery")}</div>
          <div><strong>Date:</strong> ${escapeHtml(order.created_at ? new Date(order.created_at).toLocaleString() : "—")}</div>
        </article>
      `).join("");
    }

    /* =========================
       START
    ========================= */

    loadListing();

  </script>

</body>
</html>
