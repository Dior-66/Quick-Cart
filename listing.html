<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cart - Listing</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 18px 5%;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ff6b00;
      font-size: 28px;
      font-weight: bold;
    }

    .cart-icon {
      width: 48px;
      height: 48px;
      background: #ff6b00;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .back {
      color: #ff6b00;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .image-box {
      width: 100%;
      min-height: 350px;
      background: #f1f2f4;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 34px;
    }

    .price {
      color: #ff6b00;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .location,
    .condition {
      color: #666;
      margin: 8px 0;
      font-size: 16px;
    }

    .description {
      margin-top: 25px;
      line-height: 1.7;
      color: #444;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #ff6b00;
      color: white;
    }

    button.secondary {
      background: #eee;
      color: #222;
    }

    .status {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    @media (max-width: 700px) {
      .logo {
        font-size: 22px;
      }

      .card {
        padding: 20px;
      }

      .image-box {
        min-height: 250px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="navbar">
    <div class="logo">
      <div class="cart-icon">🛒</div>
      Quick Cart
    </div>

    <a class="back" href="index.html">← Back to listings</a>
  </div>
</header>

<main>
  <div id="content" class="status">
    Loading listing...
  </div>
</main>

<script>
  const SUPABASE_URL = "https://dgnkmkyueqgbiahztuux.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4j_ZqL-Mw_nH9oguTAi68g_mM-FHFT_";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const params = new URLSearchParams(window.location.search);
  const listingId = params.get("id");

  async function loadListing() {
    const content = document.getElementById("content");

    if (!listingId) {
      content.innerHTML = `
        <div class="status">
          <h2>Listing not found</h2>
          <p>No listing ID was provided.</p>
          <a class="back" href="index.html">← Back to listings</a>
        </div>
      `;
      return;
    }

    const { data, error } = await supabaseClient
      .from("listings")
      .select("*")
      .eq("id", listingId)
      .eq("status", "Active")
      .single();

    if (error || !data) {
      console.error("Listing error:", error);

      content.innerHTML = `
        <div class="status">
          <h2>Listing not found</h2>
          <p>This listing may no longer be available.</p>
          <a class="back" href="index.html">← Back to listings</a>
        </div>
      `;
      return;
    }

    content.innerHTML = `
      <div class="card">
        <div class="image-box">🛒</div>

        <h1>${escapeHtml(data.title || "Untitled Listing")}</h1>

        <div class="price">
          ${escapeHtml(data.currency || "USD")} ${escapeHtml(String(data.price ?? ""))}
        </div>

        <div class="location">
          📍 ${escapeHtml(data.location || "Location not specified")}
        </div>

        <div class="condition">
          Condition: ${escapeHtml(data.condition || "Not specified")}
        </div>

        <div class="description">
          <h3>Description</h3>
          <p>${escapeHtml(data.description || "No description provided.")}</p>
        </div>

        <div class="buttons">
          <button onclick="alert('Messaging will be connected next.')">
            Message Seller
          </button>

          <button class="secondary" onclick="history.back()">
            Back
          </button>
        </div>
      </div>
    `;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadListing();
</script>

</body>
</html>
