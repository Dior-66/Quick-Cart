<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quick Cart — Product</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      min-height: 72px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f97316;
      font-size: 25px;
      font-weight: 800;
    }

    .cart-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f97316;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .back-top {
      color: #333;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #eee;
      box-shadow: 0 5px 25px rgba(0,0,0,0.05);
    }

    .gallery {
      background: #f3f4f6;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: 420px;
      object-fit: contain;
      display: none;
      background: #f3f4f6;
    }

    .placeholder {
      font-size: 80px;
    }

    .content {
      padding: 35px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
      line-height: 1.15;
    }

    .price {
      color: #f97316;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .location,
    .condition {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .condition strong {
      color: #333;
    }

    .description-title {
      margin-top: 30px;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .description {
      color: #444;
      font-size: 17px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .primary {
      background: #f97316;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .status {
      max-width: 700px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
    }

    .status h2 {
      margin-bottom: 12px;
    }

    .status p {
      color: #666;
      margin-bottom: 20px;
    }

    .gallery-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .thumb {
      width: 60px;
      height: 45px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid white;
      cursor: pointer;
      background: white;
    }

    .thumb.active {
      border-color: #f97316;
    }

    footer {
      margin-top: 50px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 700px) {
      .container {
        margin: 20px auto;
        padding: 0 12px;
      }

      .gallery {
        min-height: 300px;
      }

      .main-image {
        height: 300px;
      }

      .content {
        padding: 25px 20px;
      }

      h1 {
        font-size: 30px;
      }

      .price {
        font-size: 27px;
      }

      .navbar {
        padding: 12px 15px;
      }

      .back-top {
        font-size: 14px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header>
    <nav class="navbar">

      <a href="index.html" class="logo">
        <div class="cart-icon">🛒</div>
        Quick Cart
      </a>

      <a href="index.html" class="back-top">
        ← Back to Listings
      </a>

    </nav>
  </header>

  <main class="container">

    <div id="content">

      <div class="status">
        <h2>Loading listing...</h2>
        <p>Please wait.</p>
      </div>

    </div>

  </main>

  <footer>
    © 2026 Quick Cart — Buy Smart. Sell Easy.
  </footer>

  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://dgnkmkyueqgbiahztuux.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_4j_ZqL-Mw_nH9oguTAi68g_mM-FHFT_";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* =========================
       GET LISTING ID
    ========================= */

    const params =
      new URLSearchParams(window.location.search);

    const listingId =
      params.get("id");


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       IMAGE URL
    ========================= */

    function getImageUrl(image) {

      if (!image) {
        return null;
      }

      return (
        image.image_url ||
        image.url ||
        image.public_url ||
        image.storage_url ||
        image.path ||
        null
      );

    }


    /* =========================
       LOAD LISTING
    ========================= */

    async function loadListing() {

      const content =
        document.getElementById("content");


      if (!listingId) {

        content.innerHTML = `
          <div class="status">
            <h2>Listing not found</h2>
            <p>No listing ID was provided.</p>
            <a class="button primary" href="index.html">
              Back to Listings
            </a>
          </div>
        `;

        return;
      }


      try {

        /* GET LISTING */

        const listingResult =
          await supabaseClient
            .from("listings")
            .select("*")
            .eq("id", listingId)
            .eq("status", "Active")
            .single();


        const listing =
          listingResult.data;

        const listingError =
          listingResult.error;


        if (listingError || !listing) {

          console.error(
            "Listing error:",
            listingError
          );

          content.innerHTML = `
            <div class="status">
              <h2>Listing not found</h2>
              <p>This listing may no longer be available.</p>
              <a class="button primary" href="index.html">
                Back to Listings
              </a>
            </div>
          `;

          return;
        }


        /* GET IMAGES */

        let images = [];

        const imageResult =
          await supabaseClient
            .from("listing_images")
            .select("*")
            .eq("listing_id", listingId)
            .order("display_order", {
              ascending: true
            });


        if (!imageResult.error && imageResult.data) {
          images = imageResult.data;
        }


        console.log(
          "Quick Cart listing:",
          listing
        );

        console.log(
          "Quick Cart listing images:",
          images
        );


        /* IMAGE URLS */

        const imageUrls =
          images
            .map(getImageUrl)
            .filter(Boolean);


        content.innerHTML = `

          <div class="card">

            <div class="gallery">

              ${
                imageUrls.length > 0

                ? `
                  <img
                    id="mainImage"
                    class="main-image"
                    src="${escapeHtml(imageUrls[0])}"
                    alt="${escapeHtml(listing.title)}"
                    style="display:block;"
                  >

                  <div class="gallery-controls">

                    ${imageUrls.map((url, index) => `
                      <img
                        class="thumb ${index === 0 ? "active" : ""}"
                        src="${escapeHtml(url)}"
                        alt="Product image ${index + 1}"
                        onclick="changeImage(${index})"
                      >
                    `).join("")}

                  </div>
                `

                : `
                  <div class="placeholder">
                    🛒
                  </div>
                `
              }

            </div>


            <div class="content">

              <h1>
                ${escapeHtml(
                  listing.title || "Untitled Listing"
                )}
              </h1>


              <div class="price">
                ${escapeHtml(
                  listing.currency || "USD"
                )}
                ${escapeHtml(
                  String(listing.price ?? "")
                )}
              </div>


              <div class="location">
                📍
                ${escapeHtml(
                  listing.location ||
                  "Location not specified"
                )}
              </div>


              ${
                listing.condition
                ? `
                  <div class="condition">
                    <strong>Condition:</strong>
                    ${escapeHtml(listing.condition)}
                  </div>
                `
                : ""
              }


              <h2 class="description-title">
                Description
              </h2>


              <div class="description">
                ${escapeHtml(
                  listing.description ||
                  "No description provided."
                )}
              </div>


              <div class="buttons">

                <button
                  class="button primary"
                  onclick="messageSeller()"
                >
                  Message Seller
                </button>


                <a
                  class="button secondary"
                  href="index.html"
                >
                  ← Back
                </a>

              </div>

            </div>

          </div>
        `;


        window.quickCartImages =
          imageUrls;


      } catch (error) {

        console.error(
          "Unexpected listing error:",
          error
        );

        content.innerHTML = `
          <div class="status">
            <h2>Something went wrong</h2>
            <p>Please refresh the page and try again.</p>
            <a class="button primary" href="index.html">
              Back to Listings
            </a>
          </div>
        `;
      }
    }


    /* =========================
       CHANGE IMAGE
    ========================= */

    function changeImage(index) {

      const images =
        window.quickCartImages || [];

      if (!images[index]) {
        return;
      }

      const mainImage =
        document.getElementById("mainImage");

      if (mainImage) {

        mainImage.src =
          images[index];

        mainImage.style.display =
          "block";
      }


      document
        .querySelectorAll(".thumb")
        .forEach(function(thumb, i) {

          thumb.classList.toggle(
            "active",
            i === index
          );

        });

    }


    /* =========================
       MESSAGE SELLER
    ========================= */

    function messageSeller() {

      alert(
        "Message Seller will be connected to Quick Cart messaging next."
      );

    }


    /* =========================
       START
    ========================= */

    loadListing();

  </script>

</body>
</html>
