<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Orders | Quick Cart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#ff7417;--ink:#1f2937;--muted:#667085;--line:#e5e7eb;--bg:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:25px;font-weight:800;color:var(--orange)}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}a,button{font:inherit}a{color:var(--orange);text-decoration:none;font-weight:700}.btn{border:0;border-radius:10px;padding:11px 16px;background:#eee;color:#111;font-weight:700;cursor:pointer}.btn.primary{background:var(--orange);color:white}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:27px;margin:0 0 8px}h2{margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.notice{padding:13px 15px;border-radius:10px;background:#fff5eb;color:#9a3412;margin:14px 0;line-height:1.5}.error{background:#fff0f0;color:#9b1c1c}.success{background:#ecfdf3;color:#166534}.order{border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:14px}.orderhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{display:inline-block;background:#fff2e8;color:#a94400;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}.detail{background:#f9fafb;border-radius:9px;padding:11px;overflow-wrap:anywhere}.detail b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.empty{text-align:center;padding:35px 10px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:28px;font-size:14px}@media(max-width:600px){.panel{padding:16px}h1{font-size:23px}}
</style></head>
<body>
<header><div class="brand">🛒 Quick Cart<small>Buy Smart. Sell Easy.</small></div><div class="nav"><a href="index.html">Browse products</a><a href="sell.html">Sell an item</a><button class="btn" id="refreshTop">Refresh orders</button><button class="btn" id="signOut" hidden>Sign out</button></div></header>
<main class="wrap"><section class="panel"><div class="topline"><div><h1>Seller Orders</h1><div class="muted">Orders placed for products linked to your seller account.</div></div><button class="btn primary" id="refresh">Refresh orders</button></div><div id="message" class="notice">Checking your login…</div><div id="loginActions" hidden><a href="login.html">Log in to your seller account</a></div></section><section class="panel"><div class="topline"><h2>Incoming orders</h2><span class="muted" id="count"></span></div><div id="orders"><div class="empty">Loading orders…</div></div></section></main>
<footer>© 2026 Quick Cart — Buy Smart. Sell Easy.</footer>
<script>
const SUPABASE_URL='https://dgnkmkyueqgbiahztuux.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_4j_ZqL-Mw_nH9oguTAi68g_mM-FHFT_';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const messageEl=document.getElementById('message'), ordersEl=document.getElementById('orders'), countEl=document.getElementById('count'), loginActions=document.getElementById('loginActions'), signOutBtn=document.getElementById('signOut');
function message(text,type=''){messageEl.textContent=text;messageEl.className='notice '+type;}
function safe(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v,c){if(v===null||v===undefined||v==='')return '—';return safe(c?`${c} ${v}`:v);}
function orderCard(o){const created=o.created_at?new Date(o.created_at).toLocaleString(): '—';return `<article class="order"><div class="orderhead"><div><strong>Order: ${safe(o.order_number||o.id)}</strong><div class="muted" style="margin-top:6px">${safe(created)}</div></div><span class="status">${safe(o.order_status||'New order')}</span></div><div class="details"><div class="detail"><b>PRODUCT</b>${safe(o.item_title)}</div><div class="detail"><b>QUANTITY</b>${safe(o.quantity??1)}</div><div class="detail"><b>AGREED PRICE</b>${money(o.agreed_price,o.currency||'')}</div><div class="detail"><b>BUYER NAME</b>${safe(o.buyer_name)}</div><div class="detail"><b>BUYER PHONE</b>${safe(o.buyer_phone)}</div><div class="detail"><b>DELIVERY METHOD</b>${safe(o.delivery_method||'—')}</div><div class="detail" style="grid-column:1/-1"><b>DELIVERY ADDRESS</b>${safe(o.shipping_address)}</div><div class="detail"><b>PAYMENT STATUS</b>${safe(o.payment_status||'—')}</div></div></article>`;}
async function loadOrders(){ordersEl.innerHTML='<div class="empty">Loading orders…</div>';countEl.textContent='';loginActions.hidden=true;const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){message('Please log in with the seller account to view orders.');loginActions.hidden=false;signOutBtn.hidden=true;ordersEl.innerHTML='<div class="empty">Log in to view orders for your account.</div>';return;}signOutBtn.hidden=false;message('Signed in. Loading orders for this seller…','success');const {data,error}=await db.from('orders').select('id,order_number,listing_id,seller_id,item_title,quantity,original_price,agreed_price,order_status,payment_status,delivery_method,shipping_address,created_at,buyer_name,buyer_phone').eq('seller_id',user.id).order('created_at',{ascending:false});if(error){message('Could not load seller orders: '+error.message+'. Supabase must allow sellers to SELECT their own orders in Row Level Security (RLS).','error');ordersEl.innerHTML='<div class="empty">Orders could not be loaded. Check the seller SELECT policy in Supabase.</div>';return;}if(!data||data.length===0){message('You are signed in, but no orders are visible for this seller. If an order exists in the database, check that its seller_id matches this account and that RLS allows the seller to read it.');ordersEl.innerHTML='<div class="empty">No orders found for this seller yet.</div>';return;}message('Orders loaded successfully.','success');countEl.textContent=`${data.length} order${data.length===1?'':'s'}`;ordersEl.innerHTML=data.map(orderCard).join('');}
document.getElementById('refresh').addEventListener('click',loadOrders);document.getElementById('refreshTop').addEventListener('click',loadOrders);signOutBtn.addEventListener('click',async()=>{await db.auth.signOut();location.href='login.html';});loadOrders();
</script></body></html>
