
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f97316">
  <title>Sign Up | Quick Cart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7ed;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 460px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }
    h1 { color: #f97316; margin-top: 0; }
    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }
    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #f97316;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 9px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .success { display: block; background: #dcfce7; color: #166534; }
    .error { display: block; background: #fee2e2; color: #991b1b; }
    a { color: #ea580c; }
    .links { margin-top: 20px; line-height: 2; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Join Quick Cart</h1>
    <p>Create your account to buy or sell products.</p>

    <form id="signupForm">
      <label for="fullName">Your name</label>
      <input id="fullName" type="text" maxlength="100"
             autocomplete="name" required>

      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Create password</label>
      <input id="password" type="password" minlength="6"
             autocomplete="new-password" required>

      <label for="accountType">I want to</label>
      <select id="accountType" required>
        <option value="buyer">Buy products</option>
        <option value="seller">Sell products</option>
      </select>

      <button id="signupButton" type="submit">Create Account</button>
    </form>

    <div id="message" class="message" role="status"></div>

    <div class="links">
      Already have an account? <a href="./login.html">Sign in</a>
      <br>
      <a href="./index.html">Back to home</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://dgnkmkyueqgbiahztuux.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_4j_ZqL-Mw_nH9oguTAi68g_mM-FHFT_";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Creating account...";

      message.className = "message";
      message.textContent = "";

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const requestedRole =
        document.getElementById("accountType").value;

      try {
        if (!fullName) {
          throw new Error("Please enter your name.");
        }

        if (!["buyer", "seller"].includes(requestedRole)) {
          throw new Error("Please choose a valid account type.");
        }

        const result = await db.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName,
              requested_role: requestedRole
            }
          }
        });

        if (result.error) throw result.error;

        form.reset();

        if (result.data.session) {
          showMessage(
            "Your account has been created successfully. You can now continue to Quick Cart.",
            "success"
          );

          setTimeout(function() {
            window.location.href = "./index.html";
          }, 1800);
        } else {
          showMessage(
            "Account created! Please check your email and confirm your account. Then sign in to Quick Cart.",
            "success"
          );
        }

      } catch (error) {
        showMessage(
          error.message || "Could not create your account.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
